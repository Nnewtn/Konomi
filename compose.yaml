services:
  konomi:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
    volumes:
      - konomi_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  konomi_data:
