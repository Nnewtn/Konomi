<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Konomi AI · Gęsi Puch</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { onyx:'#0F1115', onyx2:'#161A21', cream:'#F9F8F6', lime:'#CCFF00', lime2:'#A3E635', emer:'#15803D', coral:'#E8836B' },
  fontFamily: { word:['Poppins','sans-serif'], ui:['Inter','sans-serif'] }
}}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream text-onyx antialiased font-ui">

<!-- ================= APPBAR ================= -->
<header id="appbar" class="sticky top-0 z-40 bg-onyx text-cream">
  <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
    <!-- Logo: строгий гротеск, фиксированная геометрия, не сжимается -->
    <div class="flex items-center gap-2 shrink-0 select-none">
      <span class="wordmark text-[19px] tracking-tight text-cream whitespace-nowrap">Konomi</span>
      <span class="wordmark text-[10px] font-bold text-onyx bg-lime rounded-[6px] px-1.5 py-[3px] leading-none tracking-widest">AI</span>
    </div>
    <!-- Venue -->
    <div class="min-w-0 text-center">
      <div class="wordmark text-[14px] text-cream/90 truncate">Gęsi Puch</div>
      <div class="text-[10px] tracking-[.16em] uppercase text-white/35" data-i18n="venue_sub">Restauracja Rodzinna</div>
    </div>
    <!-- Weather + lang -->
    <div class="flex items-center gap-2 shrink-0">
      <div id="weatherBadge" class="hidden sm:flex items-center gap-1.5 text-[12px] text-white/70 bg-white/[.06] border border-white/10 rounded-full px-3 py-1.5">
        <span id="weatherIcon" class="text-lime"></span>
        <span id="weatherText">Łódź —°C</span>
      </div>
      <div class="flex items-center text-[11px] font-semibold bg-white/[.06] border border-white/10 rounded-full p-0.5">
        <button data-lang="pl" class="lang-btn px-2 py-1 rounded-full text-white/50">PL</button>
        <button data-lang="en" class="lang-btn px-2 py-1 rounded-full text-white/50">EN</button>
        <button data-lang="ru" class="lang-btn px-2 py-1 rounded-full bg-lime text-onyx">RU</button>
      </div>
    </div>
  </div>
</header>

<!-- ================= CATALOG ================= -->
<main class="max-w-2xl mx-auto px-4 pb-80">
  <div class="pt-4">
    <div class="flex gap-2 overflow-x-auto no-scrollbar" id="catTabs"></div>
    <div class="mt-2.5 flex gap-2 overflow-x-auto no-scrollbar" id="filterChips"></div>
  </div>
  <div id="menuGrid" class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3.5"></div>
  <div id="emptyState" class="hidden text-center py-16 text-onyx/40">
    <p class="text-sm font-medium" data-i18n="empty">Под эти фильтры ничего не подошло — спросите Konomi AI.</p>
  </div>
</main>

<!-- ================= CART BAR ================= -->
<div id="cartBar" class="hide fixed bottom-[92px] left-1/2 -translate-x-1/2 z-30 w-[calc(100%-2rem)] max-w-md">
  <button id="cartOpen" class="w-full glass rounded-full pl-4 pr-1.5 py-1.5 flex items-center justify-between gap-3 text-cream spring-fast active:scale-[.98]">
    <div class="flex items-center gap-2.5 min-w-0">
      <span id="cartCount" class="shrink-0 w-6 h-6 rounded-full bg-lime text-onyx text-[12px] font-bold flex items-center justify-center">0</span>
      <span id="cartSaving" class="hidden shrink-0 text-[10px] font-bold text-onyx bg-lime2 rounded px-1.5 py-0.5">−15%</span>
    </div>
    <div class="flex items-center gap-2.5">
      <span id="cartTotal" class="wordmark text-[16px] text-lime whitespace-nowrap">0 zł</span>
      <span class="shrink-0 bg-lime text-onyx text-[12px] font-bold rounded-full px-4 py-2.5" data-i18n="cart_cta">Показать официанту</span>
    </div>
  </button>
</div>

<!-- ================= AI BOTTOM SHEET ================= -->
<section id="aiSheet" class="fixed inset-x-0 bottom-0 z-40 md:left-1/2 md:right-auto md:-translate-x-1/2 md:w-[460px]">
  <div class="glass rounded-t-[26px] overflow-hidden flex flex-col sheet-panel" id="sheetPanel">
    <div class="sheet-grab shrink-0 pt-2.5 pb-2 px-4 select-none" id="sheetGrab">
      <div class="w-10 h-1 rounded-full bg-white/25 mx-auto mb-2.5"></div>
      <div class="flex items-center gap-3">
        <div class="shrink-0 w-9 h-9 rounded-xl bg-lime flex items-center justify-center wordmark text-onyx text-[15px] font-bold">K</div>
        <div class="min-w-0 flex-1">
          <div class="text-cream font-semibold text-[14px] leading-tight wordmark">Konomi AI</div>
          <div class="text-white/40 text-[11px] truncate" data-i18n="ai_status">Сомелье онлайн · знает состав и аллергены</div>
        </div>
        <button id="sheetToggle" class="shrink-0 w-8 h-8 rounded-full bg-white/10 text-cream flex items-center justify-center spring-fast active:scale-90" aria-label="toggle">
          <svg id="sheetChevron" width="14" height="14" viewBox="0 0 16 16" fill="none" class="spring"><path d="M4 10l4-4 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div id="chatBody" class="flex-1 overflow-y-auto px-4 py-3 space-y-3 text-cream hidden"></div>
    <div class="shrink-0 p-3 pt-1">
      <div class="flex items-center gap-2 bg-white/[.07] border border-white/10 rounded-full pl-4 pr-1.5 py-1.5">
        <input id="chatInput" type="text" class="flex-1 bg-transparent outline-none text-cream placeholder-white/30 text-[14px] min-w-0" data-i18n-ph="input_ph" placeholder="Спросите Konomi AI про блюда или комбо…">
        <button id="micBtn" class="shrink-0 w-9 h-9 rounded-full bg-lime text-onyx flex items-center justify-center spring-fast active:scale-90" aria-label="voice">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 15a4 4 0 004-4V6a4 4 0 10-8 0v5a4 4 0 004 4z" stroke="currentColor" stroke-width="1.5"/><path d="M5 11a7 7 0 0014 0M12 18v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button id="sendBtn" class="shrink-0 w-9 h-9 rounded-full bg-white/12 text-cream flex items-center justify-center spring-fast active:scale-90" aria-label="send">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>

<!-- ================= ORDER MODAL ================= -->
<div id="modalWrap" class="hide fixed inset-0 z-50 flex items-end md:items-center justify-center bg-onyx/70 backdrop-blur-sm">
  <div id="modalCard" class="glass w-full md:max-w-md rounded-t-[26px] md:rounded-[26px] p-6 text-cream max-h-[86vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-1">
      <div class="wordmark text-lg">Konomi <span class="text-lime">AI</span><span class="text-white/40 text-sm font-ui" data-i18n="receipt"> · Чек гостя</span></div>
      <button id="modalClose" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center spring-fast active:scale-90 text-lg leading-none">×</button>
    </div>
    <div class="text-[12px] text-white/40 mb-4">Gęsi Puch · Łódź · <span id="modalTime"></span></div>
    <div id="modalItems" class="space-y-2.5"></div>
    <div id="modalDiscount" class="hidden mt-3 flex justify-between text-[13px] font-semibold text-lime2"></div>
    <div class="mt-4 pt-4 border-t border-white/10 flex items-center justify-between">
      <span class="text-white/55 text-sm" data-i18n="total">Итого</span>
      <span id="modalTotal" class="wordmark text-2xl text-lime">0 zł</span>
    </div>
    <div class="mt-5 bg-lime text-onyx rounded-2xl p-4 text-center">
      <div class="text-[10px] font-bold tracking-[.22em] uppercase opacity-60" data-i18n="show_code">Покажите код официанту</div>
      <div id="orderCode" class="wordmark text-3xl tracking-[.3em] mt-1">—</div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
